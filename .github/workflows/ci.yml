name: TalentBridge Admin CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  frontend-ci:
    name: Frontend (Build & Typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build & Typecheck Frontend Bundle
        run: npm run build

  backend-ci:
    name: Backend (Build, Typecheck & Test Suite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        run: npm install

      - name: Build & Typecheck Backend
        run: npm run build

      - name: Run Automated Test Suite (Auth, Cache, Funnel, Dashboards, Users)
        run: npm test
        env:
          JWT_SECRET: ci_test_secret_key_123456789
          NODE_ENV: test
